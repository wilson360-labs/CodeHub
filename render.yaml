services:
  - type: web
    name: codehub
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      # ── Notificaciones en tiempo real (web + Android) ──────────
      # Sin estas 4, el sistema de push sigue "andando" pero con
      # huecos: usa la clave VAPID de ejemplo (insegura) y/o el
      # push nativo Android (FCM) queda deshabilitado.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # JSON completo de la cuenta de servicio de Firebase (una sola
      # línea). Sin esto, la APK Android NO recibe push del servidor.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Mismo valor que el "Secret" configurado en GitHub → Settings →
      # Webhooks, para que las notificaciones de nuevas versiones
      # lleguen al instante en vez de esperar el polling cada 6h.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

# ── Tareas programadas — automatización con la config de Render ──
# Cron Jobs (type: cron, dentro de services): leen las variables del
# ENTORNO DE CADA JOB en Render (NO GitHub Secrets). Tras desplegar el
# Blueprint, crear a mano en cada cron job (Dashboard → job → Environment):
#   · check-app-updates → MONGODB_URI (misma URI Atlas del web service);
#     GITHUB_TOKEN es OPCIONAL (PAT de lectura pública: sin él, la API de
#     GitHub limita a 60 req/hora y el monitor solo revisa ~60 apps).
#   · daily-report-bot  → TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, ADMIN_KEY y
#     BACKEND_URL (mismos valores del web service).
  - type: cron
    name: check-app-updates
    runtime: node
    rootDir: backend
    schedule: "0 */12 * * *"
    buildCommand: npm install
    startCommand: node scripts/check-app-updates.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  - type: cron
    name: daily-report-bot
    runtime: python
    rootDir: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: BACKEND_URL
        sync: false

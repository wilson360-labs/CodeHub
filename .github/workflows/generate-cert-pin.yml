name: Generate Cert Pin

# One-off (workflow_dispatch): extrae la huella del certificado de firma de un
# APK ya publicado y la guarda en apk/android/keystore-pin.sha256.
# Use de nuevo SOLO si cambias deliberadamente de keystore (firma nueva,
# aceptarás que los instalados tengan que desinstalar/reinstalar).
# El workflow build-apk FALLA si el APK firmado no coincide con este pin.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag del release (ej: apk-codehub-v6.96). Vacío = latest'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-cert-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Descargar APK del release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api repos/$GITHUB_REPO/releases/latest --jq '.tag_name')
          fi
          URL=$(gh api "repos/$GITHUB_REPO/releases/tags/$TAG" --jq '.assets[] | select(.name|test(".*\\.apk$")) | .browser_download_url' | head -1)
          if [ -z "$URL" ]; then echo "::error::No hay APK en $TAG"; exit 1; fi
          echo "Descargando: $URL"
          curl -fsSL -o /tmp/release.apk "$URL"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Extraer SHA-256 del certificado
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner no encontrado"; exit 1; fi
          $APKSIGNER verify --print-certs /tmp/release.apk > /tmp/certs.txt 2>&1 || true
          cat /tmp/certs.txt
          DIGEST=$(grep -i 'SHA-256 digest' /tmp/certs.txt | head -1 | sed -E 's/.*: *//' | tr 'A-F' 'a-f' | tr -d ' :\n[:space:]')
          if [ -z "$DIGEST" ]; then echo "::error::No se pudo extraer el digest"; exit 1; fi
          printf '%s\n' "$DIGEST" > apk/android/keystore-pin.sha256
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Commit nuevo pin
        run: |
          git config user.name "codehub-ci"
          git config user.email "actions@github.com"
          git add apk/android/keystore-pin.sha256
          if git diff --cached --quiet; then echo "Pin sin cambios"; else
            git commit -m "ci: actualizar keystore pin -> ${DIGEST} (release ${TAG})"
            git push origin HEAD:main
          fi
name: Echo extensions monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 1'

permissions:
  contents: read

jobs:
  report:
    name: Comparar catálogo y releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CodeHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Generar informe
        run: node scripts/check-echo-extensions.js
        env:
          ECHO_REPORT_PATH: ${{ runner.temp }}/echo-extensions-report.md
          GITHUB_TOKEN: ${{ github.token }}

      - name: Guardar informe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-extensions-report-${{ github.run_id }}
          path: ${{ runner.temp }}/echo-extensions-report.md
          if-no-files-found: error
          retention-days: 30
name: ðŸŒ± CodeHub CatÃ¡logo Open Source â€” Siembra inicial

# Se puede ejecutar manualmente o al cambiar el catÃ¡logo Android en main.
# Antes de sembrar, resuelve los applicationId reales desde los repos fuente
# para que el APK pueda detectar instalaciones y ofrecer actualizaciones.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/foss-catalog-seed.json'
      - 'backend/scripts/seed-foss-catalog.js'
      - 'backend/scripts/resolve-package-names.js'
      - '.github/workflows/seed-foss-catalog.yml'

permissions:
  contents: read

jobs:
  seed-catalog:
    name: Sembrar catÃ¡logo Open Source en MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ðŸ“¥ Checkout repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: âš™ï¸ Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: ðŸ”Ž Resolver packageName reales de Android
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_PACKAGE_RESOLVE: 'true'
        run: node scripts/resolve-package-names.js

      - name: ðŸ“¦ Instalar dependencias (mongoose)
        working-directory: ./backend
        run: npm install mongoose --no-save

      - name: ðŸŒ± Sembrar catÃ¡logo
        working-directory: ./backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/seed-foss-catalog.js

      - name: ðŸ”Ž Revisar versiones/enlaces reciÃ©n sembrados
        working-directory: ./backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-app-updates.js


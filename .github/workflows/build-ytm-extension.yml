name: Build YouTube Music Extension (Echo)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo del fork (owner/name)'
        required: true
        default: 'abhishekkchoudharyy/Eco-Youtube_Music'
      ref:
        description: 'Branch o tag a compilar'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build extension APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook variables from gradle.properties
        working-directory: .
        run: |
          name=$(grep '^extName=' gradle.properties | cut -d'=' -f2)
          echo "NAME=$name Extension" >> $GITHUB_ENV
          id=$(grep '^extId=' gradle.properties | cut -d'=' -f2)
          echo "TAG=$id" >> $GITHUB_ENV

      - name: Make environment
        run: |
          version=$(echo ${{ github.sha }} | cut -c1-7)
          echo "VERSION=v$version" >> $GITHUB_ENV
          echo -e "## ${{ env.NAME }}\nBuild from ${{ github.event.inputs.repo }}@${{ github.event.inputs.ref }}" > commit.txt
          echo "APP_PATH=app/build/${{ env.TAG }}-$version.eapk" >> $GITHUB_ENV
          chmod +x ./gradlew

      - name: Build with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ${{ env.APP_PATH }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-extension
          path: ${{ env.APP_PATH }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytm-${{ github.run_number }}
          name: YouTube Music Extension (CodeBeat build)
          files: ${{ env.APP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

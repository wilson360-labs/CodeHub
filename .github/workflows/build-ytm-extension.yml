name: Build YouTube Music Extension (Echo)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo del fork (owner/name)'
        required: true
        default: 'wilson360-labs/Eco-Youtube_Music'
      ref:
        description: 'Branch o tag a compilar'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build extension APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CodeHub (para catalogo)
        uses: actions/checkout@v7
        with:
          path: codehub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          path: ext

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook variables from gradle.properties
        working-directory: ext
        run: |
          set -euo pipefail
          name=$(grep '^extName=' gradle.properties | cut -d'=' -f2)
          echo "NAME=$name Extension" >> $GITHUB_ENV
          id=$(grep '^extId=' gradle.properties | cut -d'=' -f2)
          echo "TAG=$id" >> $GITHUB_ENV

      - name: Make environment
        working-directory: ext
        run: |
          set -euo pipefail
          version=$(echo ${{ github.sha }} | cut -c1-7)
          echo "VERSION=v$version" >> $GITHUB_ENV
          echo "APK_NAME=youtube-music-codebeat.eapk" >> $GITHUB_ENV
          chmod +x ./gradlew

      - name: Apply CodeBeat patch (resolver + version + fallback)
        working-directory: ext
        run: |
          set -euo pipefail

          # 1) Resolver CodeBeat (cabeceras de reproduccion + pre-flight de URLs)
          PATCHED="$GITHUB_WORKSPACE/codehub/extensions/youtube-music/YouTubeStreamResolver.kt"
          test -f "$PATCHED"
          TARGET=$(find . -type f -name 'YouTubeStreamResolver.kt' -path '*streaming*' | head -n 1)
          if [ -z "$TARGET" ]; then
            TARGET=$(find . -type f -name 'YouTubeStreamResolver.kt' | head -n 1)
          fi
          test -n "$TARGET"
          echo "Parcheando: $TARGET"
          cp "$PATCHED" "$TARGET"
          grep -q 'CodeBeat: sesion autenticada' "$TARGET"
          echo "Parche aplicado OK ($(wc -l < "$TARGET") lineas)"

          # 2) Version unica por build. El fork deriva version/version_code del git
          #    del checkout, que NO cambia (el parche va sin commitear), asi que
          #    todos los builds salian identicos (vba0fa73) y la app no podia
          #    distinguirlos. Ahora se inyectan desde el numero de run.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          before = s
          s = s.replace(
              'val verCode = gitCount',
              'val verCode = System.getenv("YTM_VERSION_CODE")?.toIntOrNull() ?: gitCount')
          s = s.replace(
              'val verName = "v$gitHash"',
              'val verName = System.getenv("YTM_VERSION_NAME") ?: "v$gitHash"')
          if s == before:
              raise SystemExit("No se pudo inyectar la version en app/build.gradle.kts")
          p.write_text(s, encoding="utf-8")
          PY
          grep -q 'YTM_VERSION_NAME' app/build.gradle.kts

          # 3) El "update_url" del manifiesto (fallback cuando el catalogo de
          #    CodeHub no responde) apuntaba al repo upstream de Abhishek, lo que
          #    reinstalaba la extension SIN el parche. Se redirige al proxy.
          python3 - <<'PY'
          import pathlib
          proxy = "https://codehub-98s6.onrender.com/api/extensions/pkg/Youtube_music"
          p = pathlib.Path("gradle.properties")
          lines = p.read_text(encoding="utf-8").splitlines()
          out, seen = [], False
          for line in lines:
              if line.startswith("extUpdateUrl="):
                  out.append("extUpdateUrl=" + proxy); seen = True
              else:
                  out.append(line)
          if not seen:
              out.append("extUpdateUrl=" + proxy)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY
          grep -q 'extUpdateUrl=https://codehub-98s6.onrender.com/api/extensions/pkg/Youtube_music' gradle.properties
          echo "Version y fallback listos (cb-${GITHUB_RUN_NUMBER})"

      - name: Build with Gradle
        working-directory: ext
        env:
          YTM_VERSION_CODE: ${{ github.run_number }}
          YTM_VERSION_NAME: cb-${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/youtube-music-codebeat.eapk"
          test -f "$GITHUB_WORKSPACE/youtube-music-codebeat.eapk" && echo "APK listo: $(du -h "$GITHUB_WORKSPACE/youtube-music-codebeat.eapk" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ytm-extension
          path: youtube-music-codebeat.eapk

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ytm-${{ github.run_number }}
          name: YouTube Music Extension (CodeBeat build)
          files: youtube-music-codebeat.eapk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CodeBeat catalog
        working-directory: codehub
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/ytm-${{ github.run_number }}/youtube-music-codebeat.eapk
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/ytm-${RUN_NUMBER}/youtube-music-codebeat.eapk"
          echo "Updating catalog with: $DOWNLOAD_URL"
          python3 - <<'PY'
          import json, os
          path = "backend/data/codebeat-extensions.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          url = os.environ["DOWNLOAD_URL"]
          version = "cb-" + os.environ["RUN_NUMBER"]
          for item in data:
              if item.get("id") == "Youtube_music":
                  item["updateUrl"] = url
                  item["version"] = version
                  item["subtitle"] = "Reproduce musica de YouTube en CodeBeat (build CodeBeat)"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/codebeat-extensions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(codebeat): actualiza YouTube Music a build CodeBeat ytm-${RUN_NUMBER}"
            git push
          fi

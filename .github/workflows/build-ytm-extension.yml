name: Build YouTube Music Extension (Echo)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repo del fork (owner/name)'
        required: true
        default: 'wilson360-labs/Eco-Youtube_Music'
      ref:
        description: 'Branch o tag a compilar'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build:
    name: Build extension APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CodeHub (para catalogo)
        uses: actions/checkout@v4
        with:
          path: codehub
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repo }}
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive
          path: ext

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Cook variables from gradle.properties
        working-directory: ext
        run: |
          name=$(grep '^extName=' gradle.properties | cut -d'=' -f2)
          echo "NAME=$name Extension" >> $GITHUB_ENV
          id=$(grep '^extId=' gradle.properties | cut -d'=' -f2)
          echo "TAG=$id" >> $GITHUB_ENV

      - name: Prepare Release Keystore (igual que build-apk.yml)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SUPABASE_URL: ${{ secrets.KEYSTORE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        working-directory: ext
        run: |
          KS="signing-key.jks"
          keystore_ok=false

          adopt_keystore () {
            chmod 600 "$KS"
            keystore_ok=true
            echo "HAS_RELEASE_SECRETS=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          }

          temp_keystore () {
            echo "Keystore temporal (debug): la compilacion completara, pero NO sera valido para actualizar."
            rm -f "$KS"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias codehub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CodeHub, OU=CI, O=CodeHub, L=Local, S=Local, C=US" >/dev/null 2>&1
            chmod 600 "$KS"
            echo "HAS_RELEASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          }

          # Fuente 1: Supabase Storage (privado)
          if [ -n "$KEYSTORE_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] \
             && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Descargando keystore desde Supabase..."
            if curl -fsSL -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -o "$KS" "$KEYSTORE_SUPABASE_URL" 2>/dev/null; then
              if keytool -certreq -alias codehub -keystore "$KS" \
                  -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
                adopt_keystore
              else
                rm -f "$KS"
              fi
            else
              rm -f "$KS"
            fi
          fi

          # Fuente 2: base64 persistente en secrets
          if [ "$keystore_ok" = false ] && [ -n "$KEYSTORE_BASE64" ] \
             && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null
            if keytool -certreq -alias codehub -keystore "$KS" \
                -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" >/dev/null 2>&1; then
              adopt_keystore
            else
              rm -f "$KS"
            fi
          fi

          # Fallback: keystore temporal
          if [ "$keystore_ok" = false ]; then
            temp_keystore
          fi

          echo "APP_PATH=app/build/${{ env.TAG }}-codebeat.eapk" >> "$GITHUB_ENV"
          chmod +x ./gradlew

      - name: Build with Gradle
        working-directory: ext
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/ext/signing-key.jks \
            -Pandroid.injected.signing.store.password=${{ env.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=codehub \
            -Pandroid.injected.signing.key.password=${{ env.KEY_PASSWORD }} \
            --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/${{ env.APK_NAME }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ytm-extension
          path: ${{ env.APK_NAME }}

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ytm-${{ github.run_number }}
          name: YouTube Music Extension (CodeBeat build)
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CodeBeat catalog
        working-directory: codehub
        env:
          APK_NAME: ${{ env.APK_NAME }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/ytm-${RUN_NUMBER}/${APK_NAME}"
          echo "Updating catalog with: $DOWNLOAD_URL"
          python3 - <<'PY'
          import json, os
          path = "backend/data/codebeat-extensions.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          url = os.environ["DOWNLOAD_URL"]
          for item in data:
              if item.get("id") == "Youtube_music":
                  item["updateUrl"] = url
                  item["subtitle"] = "Reproduce musica de YouTube en CodeBeat (build CodeBeat)"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/codebeat-extensions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(codebeat): actualiza YouTube Music a build CodeBeat ytm-${RUN_NUMBER}"
            git push
          fi

name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  audit:
    name: Sintaxis + refs + inline + estructural
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Sintaxis JS (node --check)
        run: node scripts/syntax-check.js

      - name: Referencias locales (HTML + sw.js PRECACHE + manifest)
        run: node scripts/audit-refs.js

      - name: Scripts inline de los HTML
        run: node scripts/check-inline.js

      - name: Auditoría estructural PWA / backend
        run: node scripts/audit-project.js

  build:
    name: Build esbuild (dist/ aislado)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verificar manifest y outputs
        run: |
          node -e "const m = require('./dist/build-manifest.json'); const n = Object.keys(m.bundles).length; if (n < 10) { throw new Error('pocos bundles: ' + n); } console.log('bundles ok: ' + n);"

      - name: Verificar que index.html referencia bundles reales (sin drift)
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const refs=[...html.matchAll(/src=\"(\/dist\/assets\/[^\"]+)\"/g)].map(m=>m[1]); if(!refs.length){throw new Error('index.html sin refs a /dist/assets');} const missing=refs.filter(r=>!fs.existsSync(r.slice(1))); if(missing.length){throw new Error('refs rotas: '+missing.join(', '));} console.log('index.html -> '+refs.length+' bundles OK');"

  e2e:
    name: Smoke E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build dist/ (index.html cableado a bundles hasheados)
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npx playwright test

      - name: Subir reporte si falla
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

  lighthouse:
    name: Lighthouse (movil/desktop) - reporte
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build dist/ (index.html cableado a bundles esbuild)
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Auditar mobile + desktop contra / (servidor local)
        run: node scripts/lighthouse-audit.js --base http://localhost:4173 --out lighthouse-out

      - name: Subir reporte Lighthouse
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-report
          path: lighthouse-out/
          retention-days: 7
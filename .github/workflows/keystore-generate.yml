name: Generate Release Keystore (una vez)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generar keystore persistente (alias codehub)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Setup Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar passwords en secrets
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "✋ Primero configura KEYSTORE_PASSWORD y KEY_PASSWORD en"
            echo "   Settings → Secrets and variables → Actions y vuelve a ejecutar."
            exit 1
          fi

      - name: Generar keystore JKS (alias codehub)
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias codehub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=CodeHub, O=CodeHub, L=Local, ST=Local, C=GT"

      - name: Generar base64 para RELEASE_KEYSTORE_BASE64
        run: |
          base64 -w0 release.jks > release-keystore-base64.txt
          echo "Listo: release-keystore-base64.txt ($(wc -c < release-keystore-base64.txt) caracteres)"

      - name: Subir keystore como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codehub-release-keystore
          path: |
            release.jks
            release-keystore-base64.txt
          retention-days: 7
          if-no-files-found: error
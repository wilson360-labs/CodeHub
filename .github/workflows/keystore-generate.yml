name: Generate Release Keystore (una vez)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generar keystore persistente (alias codehub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verificar passwords en secrets (≥6 caracteres)
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "✋ Primero configura KEYSTORE_PASSWORD y KEY_PASSWORD en"
            echo "   Settings → Secrets and variables → Actions y vuelve a ejecutar."
            exit 1
          fi
          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ] || [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "::error::keytool exige passwords de al menos 6 caracteres."
            echo "   KEYSTORE_PASSWORD = ${#KEYSTORE_PASSWORD} chars | KEY_PASSWORD = ${#KEY_PASSWORD} chars."
            echo "   Actualízalas (Settings → Secrets and variables → Actions) y vuelve a ejecutar."
            exit 1
          fi
          if [ "$KEYSTORE_PASSWORD" = "$KEY_PASSWORD" ]; then
            echo "::warning::Misma password para store y key. Es válida, pero si reduce la seguridad usa dos distintas."
          fi

      - name: Generar keystore JKS (alias codehub)
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias codehub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Wilson.E, OU=CodeHub, O=CodeHub, L=Guatemala, ST=Guatemala, C=GT"

      - name: Generar base64 para RELEASE_KEYSTORE_BASE64
        run: |
          base64 -w0 release.jks > release-keystore-base64.txt
          echo "Listo: release-keystore-base64.txt ($(wc -c < release-keystore-base64.txt) caracteres)"

      - name: Actualizar pin de firma (keystore-pin.sha256)
        run: |
          keytool -exportcert -keystore release.jks -alias codehub \
            -storepass "$KEYSTORE_PASSWORD" -rfc -file codehub-cert.pem
          DIGEST=$(openssl x509 -in codehub-cert.pem -outform der | sha256sum | cut -d' ' -f1)
          echo "Nuevo digest del certificado: $DIGEST"
          printf '%s\n' "$DIGEST" > apk/android/keystore-pin.sha256
          git config user.name "codehub-ci"
          git config user.email "actions@github.com"
          git add apk/android/keystore-pin.sha256
          if git diff --cached --quiet; then
            echo "Pin sin cambios"
          else
            git commit -m "ci: re-pin keystore (firma regenerada) -> ${DIGEST}"
            git push origin HEAD:main
          fi

      - name: Subir keystore como artefacto (descargar y guardar fuera)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codehub-release-keystore
          path: |
            release.jks
            release-keystore-base64.txt
          retention-days: 30
          if-no-files-found: error

      - name: Subir keystore a Supabase Storage privado (opcional)
        if: env.SUPABASE_SERVICE_ROLE_KEY != '' && env.SUPABASE_URL != ''
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEYSTORE_SUPABASE_PATH: ${{ vars.KEYSTORE_SUPABASE_PATH || 'codehub/keys/release.jks' }}
        run: |
          # Cierra el loop del splice: 'Build CodeHub APK' descarga este objeto
          # con KEYSTORE_SUPABASE_URL. Con x-upsert se reemplaza el keystore previo.
          echo "⬆️ Subiendo release.jks a ${SUPABASE_URL}/storage/v1/object/private/${KEYSTORE_SUPABASE_PATH}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" \
            "${SUPABASE_URL}/storage/v1/object/private/${KEYSTORE_SUPABASE_PATH}" \
            --data-binary @release.jks
          echo "✅ Keystore subido. Configura el secret KEYSTORE_SUPABASE_URL ="
          echo "   ${SUPABASE_URL}/storage/v1/object/private/${KEYSTORE_SUPABASE_PATH}"
          echo "   y los secrets KEYSTORE_PASSWORD/KEY_PASSWORD con estos mismos valores."
          echo "🔒 El objeto está en un bucket PRIVADO: nunca lo subas al bucket público 'CodeHub'."
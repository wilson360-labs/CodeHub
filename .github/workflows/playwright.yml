name: Playwright Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Playwright
        run: npm install && npx playwright install chromium --with-deps

      - name: Tests API
        run: npx playwright test tests/e2e/api.spec.js --reporter=list
        env:
          BASE_URL: https://wilson360-labs.vercel.app

      - name: Tests Frontend
        run: npx playwright test tests/e2e/home.spec.js tests/e2e/tools.spec.js tests/e2e/novedades.spec.js --reporter=list
        env:
          BASE_URL: https://wilson360-labs.vercel.app

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: tests/report/
          retention-days: 14

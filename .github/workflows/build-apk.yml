name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/android/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Compile check (debug, sin keystore)
        working-directory: apk/android
        run: gradle assembleDebug --stacktrace

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "🔑 Decodificando keystore persistente desde secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > apk/android/app/release.jks
          else
            echo "❌ RELEASE_KEYSTORE_BASE64 no está configurado."
            echo "Un APK firmado con un keystore temporal no se puede actualizar"
            echo "en dispositivos con el APK anterior (firma distinta)."
            echo "Configura RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD y KEY_PASSWORD en"
            echo "Settings → Secrets and variables → Actions antes de publicar."
            exit 1
          fi

      - name: Build Release APK
        working-directory: apk/android
        run: |
          gradle assembleRelease \
            -PKEYSTORE_PATH="${{ github.workspace }}/apk/android/app/release.jks" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find apk/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find apk/android -path "*/build/outputs/*" -type f
            exit 1
          fi
          cp "$APK" apk/android/app-release-signed.apk
          echo "path=apk/android/app-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to Supabase Storage
        if: env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            "${SUPABASE_URL}/storage/v1/object/CodeHub/app-release-signed.apk" \
            --data-binary @apk/android/app-release-signed.apk
          echo "✅ APK uploaded to Supabase Storage"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "📱 CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK — App Nativa Android
            **Versión:** ${{ steps.version.outputs.version }}
            ### Instalación
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. ¡Listo!
          files: ${{ steps.find-apk.outputs.path }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

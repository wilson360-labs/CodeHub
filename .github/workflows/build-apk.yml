name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/android/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # 8.11.1 = mínimo para AGP 8.9 (compileSdk 36, Appodeal adapters)
          gradle-version: '8.11.1'

      # android-actions/setup-android@v3 puede fallar por timeouts transitorios
      # del runner. Se prueba primero; si falla, se asume que ubuntu-latest ya
      # trae el SDK pre-instalado (compileSdk 36) en $ANDROID_HOME.
      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        continue-on-error: true

      - name: Accept SDK licenses
        run: |
          # Verificar que el SDK esté disponible (ya pre-instalado o vía setup-android)
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK no encontrado. ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "SDK listo (licenses aceptadas)"
          else
            echo "sdkmanager no encontrado, Gradle se encargará de las licenses"
          fi

      - name: Compile check (debug, sin keystore)
        working-directory: apk/android
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace > "$RUNNER_TEMP/compile-debug.log" 2>&1
          rc=$?
          echo "gradle_rc=$rc" >> "$GITHUB_ENV"
          if [ $rc -eq 0 ]; then : > "$RUNNER_TEMP/compile-debug-ok"; fi
          echo "gradle rc=$rc"
          if [ -f "$RUNNER_TEMP/compile-debug.log" ]; then tail -n 60 "$RUNNER_TEMP/compile-debug.log"; else echo "(no se generó log)"; fi
          exit $rc

      - name: Publicar error de compilacion como Issue (diagnostico)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "$RUNNER_TEMP/compile-debug-ok" ]; then exit 0; fi
          {
            echo "## Error de compilación en \`assembleDebug\` · commit \`$GITHUB_SHA\`";
            echo "";
            echo "**Paso:** Compile check (debug, sin keystore) — from '.github/workflows/build-apk.yml';"
            echo "";
            echo '```text';
            if [ -f "$RUNNER_TEMP/compile-debug.log" ]; then
              grep -nE "error:|e: \$|\\* What went wrong|Execution failed|FAILURE:|FAILED|> Task :app:" "$RUNNER_TEMP/compile-debug.log" | head -n 40 || true;
            else
              echo "(log de compilación no encontrado — el paso fue skipeado antes de correr)"
            fi
            echo '```';
          } > /tmp/compile-error-body.md
          gh issue create --repo "$GITHUB_REPO" \
            --title "CI: error de compilación APK ($GITHUB_SHA)" \
            --body-file /tmp/compile-error-body.md \
            --label "bug" 2>/dev/null || true

      - name: Fail job if compile (debug) failed
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compile-debug-ok" ]; then exit 0; fi
          echo "::error::assembleDebug fallo. Ver log: compile-debug-log"
          exit 1

      - name: Upload compile log (debug)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compile-debug-log
          path: ${{ runner.temp }}/compile-debug.log
          retention-days: 5

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SUPABASE_URL: ${{ secrets.KEYSTORE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p apk/android/app

          # Fuente 1 (recomendada): keystore en Supabase Storage privado.
          # KEYSTORE_SUPABASE_URL = URL completa del objeto privado, p.ej:
          #   $SUPABASE_URL/storage/v1/object/private/codehub/keys/release.jks
          if [ -n "$KEYSTORE_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "📦 Descargando keystore desde Supabase Storage (privado)..."
            curl -fsSL -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -o apk/android/app/release.jks "$KEYSTORE_SUPABASE_URL"
            chmod 600 apk/android/app/release.jks
            echo "Keystore magic: $(od -A n -t x1 -N 4 apk/android/app/release.jks | tr -d ' \n') (JKS=feedfeed | PKCS12=3082...)"
            echo "HAS_RELEASE_SECRETS=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "🔑 Decodificando keystore persistente desde secrets..."
            if ! echo "$KEYSTORE_BASE64" | base64 -d > apk/android/app/release.jks 2>/dev/null; then
              echo "::error::RELEASE_KEYSTORE_BASE64 no es base64 válido. Revisa que copiaste la cadena completa de [Convert]::ToBase64String()."
              exit 1
            fi
            chmod 600 apk/android/app/release.jks
            echo "Keystore magic: $(od -A n -t x1 -N 4 apk/android/app/release.jks | tr -d ' \n') (JKS=feedfeed | PKCS12=3082...)"
            echo "HAS_RELEASE_SECRETS=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "⚠️ No hay secrets de firma para release. Detalle:"
            [ -z "$KEYSTORE_BASE64" ] && echo "  - vacío o falta: RELEASE_KEYSTORE_BASE64"
            [ -z "$KEYSTORE_PASSWORD" ] && echo "  - vacío o falta: KEYSTORE_PASSWORD"
            [ -z "$KEY_PASSWORD" ] && echo "  - vacío o falta: KEY_PASSWORD"
            [ -z "$KEYSTORE_SUPABASE_URL" ] && echo "  - (opcional) no definido: KEYSTORE_SUPABASE_URL"
            [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "  - (opcional) no definido: SUPABASE_SERVICE_ROLE_KEY"
            echo "Se genera un keystore temporal para que la compilación pueda completarse."
            echo "Esto no es válido para actualizaciones sobre una versión ya instalada con otra firma."
            keytool -genkeypair -v \
              -keystore apk/android/app/release.jks \
              -alias codehub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CodeHub, OU=CI, O=CodeHub, L=Local, S=Local, C=US"
            echo "HAS_RELEASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        working-directory: apk/android
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PKEYSTORE_PATH="${{ github.workspace }}/apk/android/app/release.jks" \
            -PKEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -PKEY_PASSWORD="${KEY_PASSWORD}" > "$RUNNER_TEMP/release-build.log" 2>&1
          rc=$?
          echo "release_rc=$rc" >> "$GITHUB_ENV"
          if [ $rc -eq 0 ]; then : > "$RUNNER_TEMP/release-ok"; fi
          echo "release rc=$rc"
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then tail -n 60 "$RUNNER_TEMP/release-build.log"; else echo "(no se generó log de release)"; fi
          echo "=== APK output search ==="
          find . -path "*/outputs/*" -name "*.apk" 2>/dev/null || true
          exit $rc

      - name: Publicar error de release como Issue (diagnostico)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "$RUNNER_TEMP/release-ok" ]; then exit 0; fi
          {
            echo "## Error en \`assembleRelease\` · commit \`$GITHUB_SHA\`";
            echo "";
            echo "**Paso:** Build Release APK — from '.github/workflows/build-apk.yml';"
            echo "";
            echo '```text';
            if [ -f "$RUNNER_TEMP/release-build.log" ]; then
              grep -nE "error:|e: \$|\\* What went wrong|Execution failed|FAILURE:|FAILED|> Task :app:" "$RUNNER_TEMP/release-build.log" | head -n 40 || true;
            else
              echo "(log de release no encontrado — el paso fue skipeado antes de correr)"
            fi
            echo '```';
          } > /tmp/release-error-body.md
          gh issue create --repo "$GITHUB_REPO" \
            --title "CI: error de compilación APK release ($GITHUB_SHA)" \
            --body-file /tmp/release-error-body.md \
            --label "bug" 2>/dev/null || true

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: ${{ runner.temp }}/release-build.log
          retention-days: 5

      - name: Fail job if release build failed
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-ok" ]; then exit 0; fi
          echo "::error::assembleRelease fallo (ver log: release-build-log)"
          exit 1

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find-apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Si el build falló, los pasos de diagnóstico ya lo reportaron.
          if [ ! -f "$RUNNER_TEMP/release-ok" ]; then exit 1; fi
          # Preferir el APK de release; si no existe, cualquier .apk (debug).
          RELEASE=$(find . -path "*outputs*" -type f -name "*.apk" 2>/dev/null | grep -i release | head -1)
          APK="${RELEASE:-$(find . -path "*outputs*" -type f -name '*.apk' 2>/dev/null | head -1)}"
          if [ -z "$APK" ]; then
            echo "No APK found!"
            {
              echo "## No se encontró APK tras \`assembleRelease\` · commit \`$GITHUB_SHA\`";
              echo "";
              echo "**Paso:** Find APK — from '.github/workflows/build-apk.yml';"
              echo "";
              echo "**release-build.log (completo, es pequeño):**";
              echo '```text';
              cat "$RUNNER_TEMP/release-build.log" 2>/dev/null || true;
              echo '```';
              echo "";
              echo "**Fragmentos clave:**";
              echo '```text';
              grep -n -B3 -A30 -E "What went wrong|Execution failed|FAILURE:|e: |error: |> Task :app" "$RUNNER_TEMP/release-build.log" 2>/dev/null | head -n 200 || true;
              echo '```';
              echo "";
              echo "**Arbol de outputs de gradle:**";
              echo '```text';
              find . -path "*/outputs/*" -type f 2>/dev/null || true;
              echo '```';
            } > /tmp/apk-find-error-body.md
            gh issue create --repo "$GITHUB_REPO" \
              --title "CI: APK no encontrado tras assembleRelease ($GITHUB_SHA)" \
              --body-file /tmp/apk-find-error-body.md \
              --label "bug" 2>/dev/null || true
            exit 1
          fi
          echo "APK=$APK"
          cp "$APK" apk/android/app-release-signed.apk
          echo "path=apk/android/app-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Verificar pin de firma (keystore original)
        if: env.HAS_RELEASE_SECRETS == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          APK="${{ steps.find-apk.outputs.path }}"
          PIN="$GITHUB_WORKSPACE/apk/android/keystore-pin.sha256"
          EXPECTED=$(tr -d ' :\r\n' < "$PIN" | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ]; then
            echo "::error::Falta apk/android/keystore-pin.sha256 (genéralo con el workflow 'Generate Cert Pin')."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner no encontrado en el SDK."; exit 1; fi
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*: *//' | tr 'A-F' 'a-f' | tr -d ' :\r\n')
          if [ -z "$DIGEST" ]; then
            echo "::error::No se pudo leer el SHA-256 del certificado del APK."
            exit 1
          fi
          echo "Cert digest (firmado): $DIGEST"
          echo "Pin esperado (v6.96): $EXPECTED"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            {
              echo "## Firma inesperada en \`assembleRelease\` · commit \`$GITHUB_SHA\`";
              echo "";
              echo "El APK firmado **NO coincide con el keystore original** (pin en \`apk/android/keystore-pin.sha256\`, extraído del release v6.96).";
              echo "- **Firma detectada:** \`$DIGEST\`";
              echo "- **Pin esperado:** \`$EXPECTED\`";
              echo "";
              echo "Si el keystore cambió deliberadamente, regenera el pin con el workflow **Generate Cert Pin** (los usuarios instalados tendrán que desinstalar/reinstalar la app).";
            } > /tmp/pin-error-body.md
            gh issue create --repo "$GITHUB_REPO" \
              --title "CI: firma distinta al keystore original ($GITHUB_SHA)" \
              --body-file /tmp/pin-error-body.md \
              --label "bug" 2>/dev/null || true
            echo "::error::La firma del APK no coincide con el keystore original. No se publica el release."
            exit 1
          fi
          echo "✅ Firma verificada contra el keystore original."

      - name: Upload APK artifact
        if: always() && hashFiles('apk/android/**/*.apk') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codehub-apk-build
          path: apk/android/**/*.apk
          retention-days: 7

      - name: Upload APK to Supabase Storage
        if: env.HAS_RELEASE_SECRETS == 'true' && env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            "${SUPABASE_URL}/storage/v1/object/CodeHub/app-release-signed.apk" \
            --data-binary @apk/android/app-release-signed.apk
          echo "✅ APK uploaded to Supabase Storage"

      - name: Create Release
        if: env.HAS_RELEASE_SECRETS == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "📱 CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK — App Nativa Android
            **Versión:** ${{ steps.version.outputs.version }}
            ### Instalación
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. ¡Listo!
          files: ${{ steps.find-apk.outputs.path }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar config de actualización del APK
        if: env.HAS_RELEASE_SECRETS == 'true'
        continue-on-error: true
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CH_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          # Activa el diálogo "Actualización disponible" del APK publicando
          # apkLatestVersion + apkUpdateNotes en /api/admin/config (Render).
          # Se usa --fallback con el mensaje del commit para que el CI nunca
          # publique vacío; si no hay ADMIN_KEY en secrets, se advierte y el
          # release ya quedó publicado (el job se marca con advertencia).
          MSG="${CH_MSG:-Nueva versión de CodeHub con mejoras y correcciones}"
          node scripts/update-apk-config.js --fallback "$MSG"

      - name: Limpiar keystore local del runner
        if: always()
        run: |
          rm -f apk/android/app/release.jks
          echo "✅ release.jks eliminado del runner"

      # ── Telegram: enviar el log de build al bot cuando algo falla ──
      # El bot (TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secretos del repo) recibe los
      # fragmentos de error de compile-debug.log y release-build.log para
      # detectar la causa exacta del fallo. Máx. ~4000 chars por mensaje.
      - name: Enviar log de build a Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)

          grab_log () {
            local file="$1"; local label="$2"; local out=""
            if [ -f "$file" ]; then
              out="✳️ $label:"
              local err
              err=$(grep -nE "error:|e: \$|\\* What went wrong|Execution failed|^FAILURE|> Task :app:|Caused by:" "$file" | head -n 18)
              if [ -z "$err" ]; then err=$(tail -n 20 "$file"); fi
              out="$out
              $err"
            else
              out="✳️ $label: (log no generado, el paso fue skipeado antes de correr)"
            fi
            printf "%s" "$out"
          }

          COMPILE=$(grab_log "$RUNNER_TEMP/compile-debug.log" "compile-debug.log")
          RELEASE=$(grab_log "$RUNNER_TEMP/release-build.log" "release-build.log")

          MSG="🔴 *CodeHub · build APK falló* — commit \`$SHA_SHORT\`
          Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`\`\`text
          $COMPILE

          $RELEASE
          \`\`\`"
          # Telegram limita a 4096 caracteres → truncamos conservando el final.
          MSG=$(printf "%s" "$MSG" | head -c 3900)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" || true

name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/android/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sincronizar version de la app con sw.js
        id: appver
        shell: bash
        run: |
          set -e
          # El tag de release es apk-<VERSION> (VERSION = sw.js). Para que
          # AppUpdateChecker.java no marque actualizaciones falsas, el
          # versionName del APK publicado debe ser el mismo esquema numÃ©rico
          # que ese tag (7.15, no 1.4.0). Se inyecta aquÃ­ en build.gradle.
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          APPVER=${VERSION##*v}                 # codehub-v7.15 -> 7.15
          APPCODE=$(echo "$APPVER" | awk -F. '{printf "%d%02d\n", $1, $2}')  # 7.15 -> 715
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APPVER=$APPVER"   >> "$GITHUB_ENV"
          echo "APPCODE=$APPCODE" >> "$GITHUB_ENV"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$APPVER\"/" apk/android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $APPCODE/"       apk/android/app/build.gradle
          echo "build.gradle -> versionName $APPVER (versionCode $APPCODE)"

      - name: Setup Java JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # 8.11.1 = mÃ­nimo para AGP 8.9 (compileSdk 36)
          gradle-version: '8.13'

      # android-actions/setup-android@v3 puede fallar por timeouts transitorios
      # del runner. Se prueba primero; si falla, se asume que ubuntu-latest ya
      # trae el SDK pre-instalado (compileSdk 36) en $ANDROID_HOME.
      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        continue-on-error: true

      - name: Accept SDK licenses
        run: |
          # Verificar que el SDK estÃ© disponible (ya pre-instalado o vÃ­a setup-android)
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK no encontrado. ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            echo "SDK listo (licenses aceptadas)"
          else
            echo "sdkmanager no encontrado, Gradle se encargarÃ¡ de las licenses"
          fi

      - name: Compile check (debug, sin keystore)
        working-directory: apk/android
        continue-on-error: true
        run: |
          set +e
          gradle assembleDebug --stacktrace > "$RUNNER_TEMP/compile-debug.log" 2>&1
          rc=$?
          echo "gradle_rc=$rc" >> "$GITHUB_ENV"
          if [ $rc -eq 0 ]; then : > "$RUNNER_TEMP/compile-debug-ok"; fi
          echo "gradle rc=$rc"
          if [ -f "$RUNNER_TEMP/compile-debug.log" ]; then tail -n 60 "$RUNNER_TEMP/compile-debug.log"; else echo "(no se generÃ³ log)"; fi
          exit $rc

      - name: Publicar error de compilacion como Issue (diagnostico)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "$RUNNER_TEMP/compile-debug-ok" ]; then echo "compile OK"; exit 0; fi
          LOG="$RUNNER_TEMP/compile-debug.log"
          {
            echo "## Error de compilaciÃ³n en \`assembleDebug\` Â· commit \`$GITHUB_SHA\`";
            echo "";
            echo "**Paso:** Compile check (debug, sin keystore) â€” from '.github/workflows/build-apk.yml';"
            echo "";
            if [ -f "$LOG" ]; then
              # Solo los errores reales (con archivo:lÃ­nea y causa), sin colas
              # gigantes que se cortan. Las `e:` ya traen ubicaciÃ³n y mensaje.
              ERR1=$(grep -nE '^e: |^[[:space:]]*error:|error:' "$LOG" | head -n 60 || true)
              if [ -n "$ERR1" ]; then
                echo "**Errores kotlinc (\`e:\`, archivo:lÃ­nea:mensaje):**";
                echo '```text';
                echo "$ERR1" | sed -E "s|file://[^ ]*/([^/]+\.kt):|\1:|g" | head -n 40;
                echo '```';
                echo "";
                echo '**Causa del fallo de Gradle:**';
                echo '```text';
                grep -nE 'What went wrong|Execution failed for task|Caused by:' "$LOG" | head -n 10 || true;
                echo '```';
              else
                echo '**Sin lÃ­neas `e:` detectadas â€” causa del fallo:**';
                echo '```text';
                grep -nE 'FAILURE:|Execution failed for task|What went wrong|Caused by:' "$LOG" | head -n 25 || true;
                echo '```';
              fi
            else
              echo "(log de compilaciÃ³n no encontrado â€” el paso fue skipeado antes de correr)";
            fi
          } > /tmp/compile-error-body.md
          gh issue create --repo "$GITHUB_REPO" \
            --title "CI: error de compilaciÃ³n APK ($GITHUB_SHA)" \
            --body-file /tmp/compile-error-body.md \
            --label "bug" 2>/dev/null && echo "issue creado" || echo "gh issue create fallo"

      - name: Fail job if compile (debug) failed
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/compile-debug-ok" ]; then exit 0; fi
          echo "::error::assembleDebug fallo. Ver log: compile-debug-log"
          exit 1

      - name: Upload compile log (debug)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compile-debug-log
          path: ${{ runner.temp }}/compile-debug.log
          retention-days: 5

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SUPABASE_URL: ${{ secrets.KEYSTORE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          mkdir -p apk/android/app
          KS="apk/android/app/release.jks"
          keystore_ok=false

          # â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          valid_pw () {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::warning::$name estÃ¡ vacÃ­o"
              return 1
            fi
            if [ "${#value}" -lt 6 ]; then
              echo "::warning::$name tiene ${#value} chars (<6). keytool no acepta passwords cortas."
              return 1
            fi
            return 0
          }

          # Valida magic-bytes y que el keystore abra con storepass/keypass (alias codehub).
          probe_keystore () {
            local f="$1" magic
            magic=$(od -A n -t x1 -N 4 "$f" | tr -d ' \n')
            echo "Keystore magic: $magic (JKS=feedfeed | PKCS12=3082...)"
            case "$magic" in
              feed*|3082*|3080*) ;;
              *) echo "::error::El archivo no parece un keystore (magic=$magic)."; return 1 ;;
            esac
            if keytool -certreq -alias codehub -keystore "$f" \
                -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
                >/dev/null 2>&1; then
              echo "âœ… Keystore vÃ¡lido: storepass+keypass correctos y alias 'codehub' recuperable."
              return 0
            fi
            echo "::error::El keystore no abre con KEYSTORE_PASSWORD/KEY_PASSWORD (o falta el alias 'codehub')."
            echo "::error::Corrige los secrets o restaura el keystore original antes de publicar."
            return 1
          }

          adopt_keystore () {
            chmod 600 "$KS"
            keystore_ok=true
            echo "HAS_RELEASE_SECRETS=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          }

          temp_keystore () {
            echo "âš ï¸ Keystore temporal (failed-safe): la compilaciÃ³n completarÃ¡, pero NO habrÃ¡ release firmado."
            echo "   No es vÃ¡lido para actualizar una versiÃ³n ya instalada con otra firma."
            rm -f "$KS"
            if ! keytool -genkeypair -v \
                -keystore "$KS" \
                -alias codehub \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=CodeHub, OU=CI, O=CodeHub, L=Local, S=Local, C=US" >/dev/null 2>&1; then
              echo "::error::FallÃ³ generar el keystore temporal (reporta este CI run)."
              return 1
            fi
            [ -s "$KS" ] || { echo "::error::Keystore temporal no creado."; return 1; }
            chmod 600 "$KS"
            echo "HAS_RELEASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          }

          # â”€â”€ Fuente 1 (recomendada): keystore en Supabase Storage privado â”€â”€
          # KEYSTORE_SUPABASE_URL = URL completa del objeto privado, p.ej:
          #   $SUPABASE_URL/storage/v1/object/private/codehub/keys/release.jks
          if [ -n "$KEYSTORE_SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] \
             && valid_pw "KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
             && valid_pw "KEY_PASSWORD" "$KEY_PASSWORD"; then
            echo "ðŸ“¦ Descargando keystore desde Supabase Storage (privado)..."
            if curl -fsSL -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                -o "$KS" "$KEYSTORE_SUPABASE_URL"; then
              if probe_keystore "$KS"; then
                adopt_keystore
              else
                rm -f "$KS"
                echo "::error::Supabase no aportÃ³ un keystore firnable (archivo descartado)."
              fi
            else
              rm -f "$KS"
              echo "::error::curl no pudo descargar el keystore desde Supabase."
            fi
          fi

          # â”€â”€ Fuente 2: base64 persistente en secrets â”€â”€
          if [ "$keystore_ok" = false ] && [ -n "$KEYSTORE_BASE64" ] \
             && valid_pw "KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" \
             && valid_pw "KEY_PASSWORD" "$KEY_PASSWORD"; then
            echo "ðŸ”‘ Decodificando keystore persistente desde secrets..."
            if echo "$KEYSTORE_BASE64" | base64 -d > "$KS" 2>/dev/null && probe_keystore "$KS"; then
              adopt_keystore
            else
              rm -f "$KS"
              echo "::error::RELEASE_KEYSTORE_BASE64 no produce un keystore vÃ¡lido (Â¿base64 corrupto o passwords?)."
            fi
          fi

          # â”€â”€ Fuente 3: keystore temporal (el build jamÃ¡s se rompe) â”€â”€
          if [ "$keystore_ok" = false ]; then
            echo "âš ï¸ Ninguna fuente fue firnable. Detalle de secrets:"
            [ -z "$KEYSTORE_SUPABASE_URL" ] && echo "  âœ— KEYSTORE_SUPABASE_URL (vacÃ­o)"
            [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && echo "  âœ— SUPABASE_SERVICE_ROLE_KEY"
            [ -z "$KEYSTORE_BASE64" ] && echo "  âœ— RELEASE_KEYSTORE_BASE64"
            [ -n "$KEYSTORE_SUPABASE_URL" ] && [ -z "$KEYSTORE_PASSWORD" ] && echo "  âœ— KEYSTORE_PASSWORD (vacÃ­o)"
            [ -n "$KEYSTORE_SUPABASE_URL" ] && [ -z "$KEY_PASSWORD" ] && echo "  âœ— KEY_PASSWORD (vacÃ­o)"
            if ! temp_keystore; then
              echo "::error::Sin keystore posible â€” no hay modo de firmar el release. Aborta con diagnÃ³stico."
              exit 1
            fi
          fi

          echo ">>> HAS_RELEASE_SECRETS=$keystore_ok"

      - name: Build Release APK
        id: release-build
        working-directory: apk/android
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace \
            -PKEYSTORE_PATH="${{ github.workspace }}/apk/android/app/release.jks" \
            -PKEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -PKEY_PASSWORD="${KEY_PASSWORD}" > "$RUNNER_TEMP/release-build.log" 2>&1
          rc=$?
          echo "release_rc=$rc" >> "$GITHUB_ENV"
          if [ $rc -eq 0 ]; then : > "$RUNNER_TEMP/release-ok"; fi
          echo "release rc=$rc"
          if [ -f "$RUNNER_TEMP/release-build.log" ]; then tail -n 60 "$RUNNER_TEMP/release-build.log"; else echo "(no se generÃ³ log de release)"; fi
          echo "=== APK output search ==="
          find . -path "*/outputs/*" -name "*.apk" 2>/dev/null || true
          exit $rc

      - name: Publicar error de release como Issue (diagnostico)
        if: always() && steps.release-build.conclusion == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [ -f "$RUNNER_TEMP/release-ok" ]; then exit 0; fi
          {
            echo "## Error en \`assembleRelease\` Â· commit \`$GITHUB_SHA\`";
            echo "";
            echo "**Paso:** Build Release APK â€” from '.github/workflows/build-apk.yml';"
            echo "";
            echo '```text';
            if [ -f "$RUNNER_TEMP/release-build.log" ]; then
              ERR=$(grep -nE '^e: ' "$RUNNER_TEMP/release-build.log" | head -n 40 || true)
              if [ -n "$ERR" ]; then
                echo '**Errores kotlinc (`e:`, archivo:lÃ­nea:mensaje):**';
                echo '```text';
                echo "$ERR" | sed -E "s|file://[^ ]*/([^/]+\.kt):|\1:|g" | head -n 30;
                echo '```';
                echo "";
                echo '**Causa del fallo de Gradle:**';
                echo '```text';
                grep -nE 'What went wrong|Execution failed for task|Caused by:' "$RUNNER_TEMP/release-build.log" | head -n 10 || true;
                echo '```';
              else
                echo '**Sin lÃ­neas `e:` detectadas â€” causa del fallo:**';
                echo '```text';
                grep -nE 'FAILURE:|Execution failed for task|What went wrong|Caused by:' "$RUNNER_TEMP/release-build.log" | head -n 25 || true;
                echo '```';
              fi
            else
              echo "(log de release no encontrado â€” el paso fue skipeado antes de correr)"
            fi
            echo '```';
          } > /tmp/release-error-body.md
          gh issue create --repo "$GITHUB_REPO" \
            --title "CI: error de compilaciÃ³n APK release ($GITHUB_SHA)" \
            --body-file /tmp/release-error-body.md \
            --label "bug" 2>/dev/null && echo "issue creado" || echo "gh issue create fallo"

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: ${{ runner.temp }}/release-build.log
          retention-days: 5

      - name: Fail job if release build failed
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/release-ok" ]; then exit 0; fi
          echo "::error::assembleRelease fallo (ver log: release-build-log)"
          exit 1

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find-apk
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Si el build fallÃ³, los pasos de diagnÃ³stico ya lo reportaron.
          if [ ! -f "$RUNNER_TEMP/release-ok" ]; then exit 1; fi
          # Preferir el APK de release; si no existe, cualquier .apk (debug).
          RELEASE=$(find . -path "*outputs*" -type f -name "*.apk" 2>/dev/null | grep -i release | head -1)
          APK="${RELEASE:-$(find . -path "*outputs*" -type f -name '*.apk' 2>/dev/null | head -1)}"
          if [ -z "$APK" ]; then
            echo "No APK found!"
            {
              echo "## No se encontrÃ³ APK tras \`assembleRelease\` Â· commit \`$GITHUB_SHA\`";
              echo "";
              echo "**Paso:** Find APK â€” from '.github/workflows/build-apk.yml';"
              echo "";
              echo "**release-build.log â€” solo errores y causa:**";
              echo '```text';
              grep -E "^e: |What went wrong|Execution failed|Caused by:|^FAILURE:" "$RUNNER_TEMP/release-build.log" 2>/dev/null \
                | sed -E "s|file://[^ ]*/([^/]+\.kt):|\1:|g" | head -n 40 || true;
              echo '```';
              echo "";
              echo "**Arbol de outputs de gradle:**";
              echo '```text';
              find . -path "*/outputs/*" -type f 2>/dev/null || true;
              echo '```';
            } > /tmp/apk-find-error-body.md
            gh issue create --repo "$GITHUB_REPO" \
              --title "CI: APK no encontrado tras assembleRelease ($GITHUB_SHA)" \
              --body-file /tmp/apk-find-error-body.md \
              --label "bug" 2>/dev/null || true
            exit 1
          fi
          echo "APK=$APK"
          cp "$APK" apk/android/app-release-signed.apk
          echo "path=apk/android/app-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Verificar pin de firma (keystore original)
        if: env.HAS_RELEASE_SECRETS == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          APK="${{ steps.find-apk.outputs.path }}"
          PIN="$GITHUB_WORKSPACE/apk/android/keystore-pin.sha256"
          EXPECTED=$(tr -d ' :\r\n' < "$PIN" | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ]; then
            echo "::error::Falta apk/android/keystore-pin.sha256 (genÃ©ralo con el workflow 'Generate Cert Pin')."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner no encontrado en el SDK."; exit 1; fi
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*: *//' | tr 'A-F' 'a-f' | tr -d ' :\r\n')
          if [ -z "$DIGEST" ]; then
            echo "::error::No se pudo leer el SHA-256 del certificado del APK."
            exit 1
          fi
          echo "Cert digest (firmado): $DIGEST"
          echo "Pin esperado (v6.96): $EXPECTED"
          if [ "$DIGEST" != "$EXPECTED" ]; then
            {
              echo "## Firma inesperada en \`assembleRelease\` Â· commit \`$GITHUB_SHA\`";
              echo "";
              echo "El APK firmado **NO coincide con el keystore original** (pin en \`apk/android/keystore-pin.sha256\`, extraÃ­do del release v6.96).";
              echo "- **Firma detectada:** \`$DIGEST\`";
              echo "- **Pin esperado:** \`$EXPECTED\`";
              echo "";
              echo "Si el keystore cambiÃ³ deliberadamente, regenera el pin con el workflow **Generate Cert Pin** (los usuarios instalados tendrÃ¡n que desinstalar/reinstalar la app).";
            } > /tmp/pin-error-body.md
            gh issue create --repo "$GITHUB_REPO" \
              --title "CI: firma distinta al keystore original ($GITHUB_SHA)" \
              --body-file /tmp/pin-error-body.md \
              --label "bug" 2>/dev/null || true
            echo "::error::La firma del APK no coincide con el keystore original. No se publica el release."
            exit 1
          fi
          echo "âœ… Firma verificada contra el keystore original."

      - name: Upload APK artifact
        if: always() && hashFiles('apk/android/**/*.apk') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codehub-apk-build
          path: apk/android/**/*.apk
          retention-days: 7

      - name: Upload APK to Supabase Storage
        if: env.HAS_RELEASE_SECRETS == 'true' && env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            "${SUPABASE_URL}/storage/v1/object/CodeHub/app-release-signed.apk" \
            --data-binary @apk/android/app-release-signed.apk
          echo "âœ… APK uploaded to Supabase Storage"

      - name: Create Release
        if: env.HAS_RELEASE_SECRETS == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "ðŸ“± CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK â€” App Nativa Android
            **VersiÃ³n:** ${{ steps.version.outputs.version }}
            ### InstalaciÃ³n
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. Â¡Listo!
          files: ${{ steps.find-apk.outputs.path }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar config de actualizaciÃ³n del APK
        if: env.HAS_RELEASE_SECRETS == 'true'
        continue-on-error: true
        shell: bash
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CH_MSG: ${{ github.event.head_commit.message || '' }}
        run: |
          # Activa el diÃ¡logo "ActualizaciÃ³n disponible" del APK publicando
          # apkLatestVersion + apkUpdateNotes en /api/admin/config (Render).
          # Se usa --fallback con el mensaje del commit para que el CI nunca
          # publique vacÃ­o; si no hay ADMIN_KEY en secrets, se advierte y el
          # release ya quedÃ³ publicado (el job se marca con advertencia).
          MSG="${CH_MSG:-Nueva versiÃ³n de CodeHub con mejoras y correcciones}"
          node scripts/update-apk-config.js --fallback "$MSG"

      - name: Limpiar keystore local del runner
        if: always()
        run: |
          rm -f apk/android/app/release.jks
          echo "âœ… release.jks eliminado del runner"

      # â”€â”€ Telegram: enviar el log de build al bot cuando algo falla â”€â”€
      # El bot (TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secretos del repo) recibe los
      # fragmentos de error de compile-debug.log y release-build.log para
      # detectar la causa exacta del fallo. MÃ¡x. ~4000 chars por mensaje.
      - name: Enviar log de build a Telegram
        if: failure()
        shell: bash
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          SHA_SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)

          grab_log () {
            local file="$1"; local label="$2"; local out=""
            if [ -f "$file" ]; then
              out="âœ³ï¸ $label:"
              local err
              # Prioridad 1: errores kotlinc (e: archivo:lÃ­nea:mensaje).
              err=$(grep -E "^e: " "$file" | sed -E "s|file://[^ ]*/([^/]+\.kt):|\1:|g" | head -n 12)
              # Prioridad 2: causa del fallo de Gradle (sin volcar tareas).
              if [ -z "$err" ]; then
                err=$(grep -E "What went wrong|Execution failed for task|Caused by:|^FAILURE:" "$file" | head -n 8)
              fi
              # Prioridad 3: contexto mÃ­nimo si no hay nada reconocible.
              if [ -z "$err" ]; then err=$(grep -E "error:|Unresolved|Unclosed|exception" "$file" | head -n 8); fi
              if [ -z "$err" ]; then err="(sin lÃ­neas de error reconocibles en el log)"; fi
              out="$out
              $err"
            else
              out="âœ³ï¸ $label: (log no generado, el paso fue skipeado antes de correr)"
            fi
            printf "%s" "$out"
          }

          COMPILE=$(grab_log "$RUNNER_TEMP/compile-debug.log" "compile-debug.log")
          RELEASE=$(grab_log "$RUNNER_TEMP/release-build.log" "release-build.log")

          MSG="ðŸ”´ *CodeHub Â· build APK fallÃ³* â€” commit \`$SHA_SHORT\`
          Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          \`\`\`text
          $COMPILE

          $RELEASE
          \`\`\`"
          # Telegram limita a 4096 caracteres â†’ truncamos conservando el final.
          MSG=$(printf "%s" "$MSG" | head -c 3900)

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" || true


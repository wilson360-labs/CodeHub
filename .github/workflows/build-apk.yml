# ═══════════════════════════════════════════════════════════════
# CodeHub APK Builder — GitHub Actions
# Compila el APK usando Docker solo para el paso de build
# ═══════════════════════════════════════════════════════════════
name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate icon from Cloudinary
        run: |
          curl -sL "https://res.cloudinary.com/drlufmqes/image/upload/v1774497527/codehub_goecyh.png" -o apk/icon-512.png
          curl -sL "https://res.cloudinary.com/drlufmqes/image/upload/v1774497527/codehub_goecyh.png" -o apk/icon-maskable-512.png

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore apk/codehub-release-key.jks \
            -alias codehub \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Wilson.E, OU=CodeHub, O=CodeHub, L=Guatemala, ST=Guatemala, C=GT"

      - name: Update TWA manifest with secrets
        run: |
          sed -i "s/CHANGE_ME/${{ secrets.KEYSTORE_PASSWORD }}/g" apk/twa-manifest.json
          cat apk/twa-manifest.json

      - name: Build APK with Bubblewrap Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/apk \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -e BUBBLEWRAP_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            build --manifest=. --skipPwaValidation

      - name: List output
        run: ls -la apk/*.apk 2>/dev/null || echo "No APK found"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP "const VERSION = '\\K[^']+" sw.js)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codehub-apk-${{ steps.version.outputs.version }}
          path: apk/app-release-signed.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "📱 CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK — App Nativa Android
            **Versión:** ${{ steps.version.outputs.version }}
            ### Instalación
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. ¡Listo!
          files: apk/app-release-signed.apk
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/android/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Compile check (debug, sin keystore)
        working-directory: apk/android
        continue-on-error: true
        run: |
          gradle assembleDebug --stacktrace > "$RUNNER_TEMP/compile-debug.log" 2>&1
          rc=$?
          echo "gradle_rc=$rc" >> "$GITHUB_ENV"
          echo "gradle rc=$rc"
          tail -n 60 "$RUNNER_TEMP/compile-debug.log"
          exit 0

      - name: Publicar error de compilacion como Issue (diagnostico)
        if: env.gradle_rc != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          {
            echo "## Error de compilación en \`assembleDebug\` · commit \`$GITHUB_SHA\`";
            echo "";
            echo "**Paso:** Compile check (debug, sin keystore) — from `.github/workflows/build-apk.yml`";
            echo "";
            echo '```text';
            grep -E "^(e:|error:|\\* What went wrong|> Task :app:compile" "$RUNNER_TEMP/compile-debug.log" | head -n 40;
            echo '```';
          } > /tmp/compile-error-body.md
          gh issue create --repo "$GITHUB_REPO" \
            --title "CI: error de compilación APK ($GITHUB_SHA)" \
            --body-file /tmp/compile-error-body.md \
            --label "ci-apk" 2>/dev/null || true

      - name: Upload compile log (debug)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compile-debug-log
          path: ${{ runner.temp }}/compile-debug.log
          retention-days: 5

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p apk/android/app

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "🔑 Decodificando keystore persistente desde secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > apk/android/app/release.jks
            echo "HAS_RELEASE_SECRETS=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "⚠️ No hay secrets de firma para release."
            echo "Se genera un keystore temporal para que la compilación pueda completarse."
            echo "Esto no es válido para actualizaciones sobre una versión ya instalada con otra firma."
            keytool -genkeypair -v \
              -keystore apk/android/app/release.jks \
              -alias codehub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=CodeHub, OU=CI, O=CodeHub, L=Local, S=Local, C=US"
            echo "HAS_RELEASE_SECRETS=false" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        working-directory: apk/android
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PKEYSTORE_PATH="${{ github.workspace }}/apk/android/app/release.jks" \
            -PKEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -PKEY_PASSWORD="${KEY_PASSWORD}"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find apk/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find apk/android -path "*/build/outputs/*" -type f
            exit 1
          fi
          cp "$APK" apk/android/app-release-signed.apk
          echo "path=apk/android/app-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: always() && hashFiles('apk/android/**/*.apk') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codehub-apk-build
          path: apk/android/**/*.apk
          retention-days: 7

      - name: Upload APK to Supabase Storage
        if: env.HAS_RELEASE_SECRETS == 'true' && env.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -s -X POST \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            "${SUPABASE_URL}/storage/v1/object/CodeHub/app-release-signed.apk" \
            --data-binary @apk/android/app-release-signed.apk
          echo "✅ APK uploaded to Supabase Storage"

      - name: Create Release
        if: env.HAS_RELEASE_SECRETS == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "📱 CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK — App Nativa Android
            **Versión:** ${{ steps.version.outputs.version }}
            ### Instalación
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. ¡Listo!
          files: ${{ steps.find-apk.outputs.path }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

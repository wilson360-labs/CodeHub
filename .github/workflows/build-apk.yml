name: Build CodeHub APK

on:
  push:
    branches: [main]
    paths:
      - 'apk/android/**'
      - 'manifest.json'
      - 'sw.js'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore apk/android/app/release.jks \
            -alias codehub \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Wilson.E, OU=CodeHub, O=CodeHub, L=Guatemala, ST=Guatemala, C=GT"

      - name: Build Release APK
        working-directory: apk/android
        run: |
          gradle assembleRelease \
            -PKEYSTORE_PATH="${{ github.workspace }}/apk/android/app/release.jks" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "const VERSION" sw.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find apk/android -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find apk/android -path "*/build/outputs/*" -type f
            exit 1
          fi
          cp "$APK" apk/android/app-release-signed.apk
          echo "path=apk/android/app-release-signed.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to 0x0.st
        id: upload
        run: |
          APK_URL=$(curl -s -F "file=@apk/android/app-release-signed.apk" https://0x0.st)
          echo "url=$APK_URL" >> $GITHUB_OUTPUT
          echo "✅ APK uploaded: $APK_URL"

      - name: Update download URL in repo
        run: |
          cat > apk-download.json << EOF
          {
            "url": "${{ steps.upload.outputs.url }}",
            "version": "${{ steps.version.outputs.version }}",
            "uploaded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk-download.json
          git diff --cached --quiet || git commit -m "chore: update APK download URL (v${{ steps.version.outputs.version }})"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.version.outputs.version }}
          name: "📱 CodeHub APK ${{ steps.version.outputs.version }}"
          body: |
            ## CodeHub APK — App Nativa Android
            **Versión:** ${{ steps.version.outputs.version }}

            ### Descarga
            👉 **[Descargar APK](${{ steps.upload.outputs.url }})** (sin cuenta)

            ### Instalación
            1. Descarga el APK
            2. Abre en tu Android
            3. Acepta fuentes desconocidas
            4. ¡Listo!
          files: ${{ steps.find-apk.outputs.path }}
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CodeHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar archivos criticos
        run: |
          # Archivos en raíz
          for f in index.html sw.js manifest.json vercel.json; do
            test -f "$f" && echo "OK $f" || { echo "FALTA $f"; exit 1; }
          done
          # Archivos en /pages (rutas reales del proyecto)
          for f in pages/tools.html pages/opensource.html pages/servicios.html; do
            test -f "$f" && echo "OK $f" || { echo "FALTA $f"; exit 1; }
          done

      - name: Verificar tamano minimo
        run: |
          for f in index.html pages/tools.html; do
            size=$(wc -c < "$f")
            [ "$size" -lt 1000 ] && echo "ERROR $f vacio" && exit 1
            echo "OK $f - ${size} bytes"
          done

  verify-backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Instalar dependencias
        run: cd backend && npm install
      - name: Verificar sintaxis
        run: node --check backend/server.js && echo "Sintaxis OK"
      - name: Verificar archivos
        run: |
          test -f backend/server.js    && echo "OK server.js"
          test -f backend/package.json && echo "OK package.json"

  health-check:
    name: Verificacion de estado
    runs-on: ubuntu-latest
    needs: [verify-frontend, verify-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Esperar deploy (90s)
        run: sleep 90

      - name: Verificar rutas criticas
        id: routes
        run: |
          BASE="https://codehub-98s6.onrender.com"
          FAILS=""

          check() {
            local path="$1" method="$2" expect="$3" body="${4:-}"
            local status
            if [ "$method" = "POST" ]; then
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                -X POST -H "Content-Type: application/json" -d "$body" "$BASE$path")
            else
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BASE$path")
            fi
            echo "$method $path -> $status (esperado: $expect)"
            # $expect es una lista de codigos validos separados por '|'
            if ! echo "$status" | grep -qE "^($expect)$"; then
              FAILS="$FAILS\n- $method $path devolvio $status (esperado $expect)"
            fi
          }

          # 200 = ruta viva. Para POST con body invalido, 400 tambien
          # confirma que la ruta existe (paso la validacion de Express
          # antes de fallar por falta de "message") sin gastar tokens
          # de LLM. 404 en cualquiera de estas = ruta rota/mal ordenada.
          check "/api/health"        GET  "200"
          check "/api/chat"          POST "400|401" "{}"
          check "/api/chat/stream"   POST "400|401" "{}"
          check "/api/apps"          GET  "200"
          check "/api/releases"      GET  "200"

          if [ -n "$FAILS" ]; then
            echo -e "RUTAS ROTAS:$FAILS"
            echo "fails<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$FAILS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Todas las rutas criticas responden OK"

      - name: Avisar por Telegram si algo se rompio
        if: failure()
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🔴 *CodeHub — Deploy con rutas rotas*
          Commit: \`${{ github.sha }}\`
          ${{ steps.routes.outputs.fails }}

          Revisa el orden de rutas en server.js (una ruta despues del 404 catch-all queda inalcanzable)."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" || true


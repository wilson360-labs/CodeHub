name: CodeHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos criticos
        run: |
          for f in index.html novedades.html tools.html servicios.html sw.js manifest.json vercel.json; do
            test -f "$f" && echo "OK $f" || echo "FALTA $f"
          done
      - name: Verificar tamano minimo
        run: |
          for f in index.html tools.html; do
            size=$(wc -c < "$f")
            [ "$size" -lt 1000 ] && echo "ERROR $f vacio" && exit 1
            echo "OK $f - ${size} bytes"
          done

  verify-backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Instalar dependencias
        run: cd backend && npm install
      - name: Verificar sintaxis
        run: node --check backend/server.js && echo "Sintaxis OK"
      - name: Verificar archivos
        run: |
          test -f backend/server.js    && echo "OK server.js"
          test -f backend/package.json && echo "OK package.json"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [verify-frontend, verify-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Esperar deploy (90s)
        run: sleep 90
      - name: Verificar backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://codehub-production-729d.up.railway.app/api/health --max-time 30)
          echo "HTTP: $STATUS"
          [ "$STATUS" = "200" ] && echo "Backend OK" || echo "Status $STATUS"

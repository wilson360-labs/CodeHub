name: Rebuild assets

# Fase 0.1 — Vercel/Cloudflare sirven el root SIN build step, así que el
# `dist/` hasheado está commiteado y `index.html` apunta a esos hashes.
# Cuando cambia un `js/**`, hay que re-bundlear (esbuild) y re-cablear
# `index.html` + `sw.js`. Este workflow lo hace en CI y commitea el
# resultado, porque el entorno de desarrollo no siempre tiene Node.
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-assets
  cancel-in-progress: true

jobs:
  rebuild:
    name: esbuild + wire (commit dist)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Evita bucles: el commit del bot no debe re-disparar el job.
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build + wire (dist/ + index.html + sw.js)
        run: npm run deploy:assets

      - name: Commitear si cambió algo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios en dist/ (ya sincronizado)."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(assets): rebuild dist + wire index.html/sw.js [skip ci]"
          git push origin HEAD:main

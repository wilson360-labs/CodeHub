name: 🖼️ CodeHub — Buscar y aplicar logos Open Source

# Se ejecuta SOLO a mano (botón "Run workflow") o desde admin-hub.
# Disparo UNIVERSAL: recorre TODAS las apps open source (existentes o que
# se agreguen a futuro) que NO tienen logo oficial — imagen vacía o la
# portada social del repo (opengraph.githubassets.com). Encuentra el logo
# real (fastlane, mipmap o avatar de la org), lo sube a img/opensource/ y
# actualiza el campo imagen en MongoDB. No toca logos locales ni URLs
# externas elegidas a mano. Idempotente: las que ya tienen /img/ se saltan.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (solo reporta, no modifica nada)'
        required: false
        type: boolean
        default: false

jobs:
  enrich-logos:
    name: Aplicar logos a apps Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Necesario para subir los PNG a img/opensource/ del propio repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias (mongoose)
        working-directory: ./backend
        run: npm install mongoose --no-save

      - name: 🖼️ Buscar y aplicar logos
        working-directory: ./backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: node scripts/enrich-app-logos.js

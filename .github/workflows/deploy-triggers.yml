name: Deploy triggers

# Fuerza el deploy de producción de Vercel por API en cada push a main.
# La integración Git de Vercel dejó de auto-desplegar (producción congelada
# desde el 30-sep), así que lo disparamos con el token ya existente
# (VERCEL_TOKEN) y esperamos a que el build quede READY.
#
# Render también se dispara por API (RENDER_API_KEY, ya configurado en el
# repo): su auto-deploy nativo ha fallado antes ("checksPass" congelado),
# así que este job garantiza que cada push a main llegue a producción.
# También se puede lanzar a mano (workflow_dispatch) para reintentar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel:
    name: Vercel (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar deploy de producción en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::warning::VERCEL_TOKEN no configurado — se omite el deploy de Vercel."
            exit 0
          fi

          RESP=$(curl -sS -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"code-hub\",\"project\":\"code-hub\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":856671518,\"ref\":\"main\",\"sha\":\"${COMMIT}\"}}")

          echo "Respuesta Vercel: $(printf '%s' "${RESP}" | head -c 600)"
          DEPLOY_ID=$(printf '%s' "${RESP}" | jq -r '.id // empty')
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::error::Vercel no devolvió un id de deployment."
            exit 1
          fi
          echo "✅ Deploy de Vercel disparado: ${DEPLOY_ID}"

          # Esperar a que Vercel termine el build (hasta ~4 min)
          for i in $(seq 1 48); do
            sleep 5
            STATE=$(curl -s "https://api.vercel.com/v13/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.readyState // empty')
            echo "  estado: ${STATE}"
            if [ "${STATE}" = "READY" ]; then
              echo "✅ Vercel listo."
              exit 0
            fi
            if [ "${STATE}" = "ERROR" ] || [ "${STATE}" = "CANCELED" ]; then
              echo "::error::El deployment de Vercel terminó en ${STATE}."
              exit 1
            fi
          done
          echo "::warning::Vercel sigue construyendo tras ~4 min; se deja el deployment en curso."

  render:
    name: Render (backend)
    # Se ejecuta en cada push a main y manualmente (workflow_dispatch), para
    # asegurar que el backend de producción (srv-…) se despliega siempre aunque
    # el auto-deploy nativo de Render deje de dispararse ("checksPass").
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::warning::RENDER_API_KEY no configurado — respaldo manual de Render omitido."
            exit 0
          fi

          if [ -n "${RENDER_SERVICE_ID}" ]; then
            ID="${RENDER_SERVICE_ID}"
          else
            # La API v1 lista servicios como [{ "service": { "id": "srv-…" } }]
            # (según la cuenta puede venir el objeto plano): cubrimos ambos y
            # mostramos la lista para diagnosticar si la key no tiene acceso.
            RAW=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services?limit=100")
            echo "Render /v1/services → $(printf '%s' "${RAW}" | head -c 400)"
            ID=$(printf '%s' "${RAW}" \
              | jq -r '[.[] | (.service // .)] | map(select((.name // "") | ascii_downcase | test("codehub"))) | (.[0].id // empty)' 2>/dev/null)
          fi
          if [ -z "${ID}" ] || [ "${ID}" = "null" ]; then
            echo "::error::No se encontró el servicio 'codehub' en Render. Crea el secret RENDER_SERVICE_ID (srv-xxxx) o revisa RENDER_API_KEY."
            exit 1
          fi
          echo "Servicio Render: ${ID}"

          API_URL="https://api.render.com/v1/services/${ID}/deploys"
          RAW_RESP=$(curl -sS -w $'\\n%{http_code}' -X POST "${API_URL}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d "{\\"commitId\\":\\"\${COMMIT}\\",\\"clearCache\\":\\"do_not_clear\\"}" || true)
          HTTP_STATUS="${RAW_RESP##*$'\\n'}"
          RESP="${RAW_RESP%$'\\n'*}"
          if [ "${HTTP_STATUS}" = "${RAW_RESP}" ]; then HTTP_STATUS="000"; RESP="${RAW_RESP}"; fi
          DEPLOY_ID=$(printf '%s' "${RESP}" | jq -r '.id // .deploy.id // empty' 2>/dev/null || true)

          if [[ ! "${HTTP_STATUS}" =~ ^2 ]]; then
            echo "::error::Render respondió HTTP ${HTTP_STATUS}: $(printf '%s' "${RESP}" | head -c 500)"
            exit 1
          fi

          # Render puede responder 202 (en cola) sin un id. Busca el deploy
          # del mismo commit antes de fallar o volver a disparar uno duplicado.
          if [ -z "${DEPLOY_ID}" ]; then
            echo "Render aceptó la solicitud (HTTP ${HTTP_STATUS}) sin id inmediato; buscando deploy del commit."
            for attempt in $(seq 1 12); do
              DEPLOYS=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" "${API_URL}?limit=20" || true)
              DEPLOY_ID=$(printf '%s' "${DEPLOYS}" | jq -r --arg sha "${COMMIT}" \
                '[.[] | (.deploy // .)] | map(select((.commit.id // .commitId // "") == $sha)) | .[0].id // empty' 2>/dev/null || true)
              [ -n "${DEPLOY_ID}" ] && break
              sleep 5
            done
          fi

          echo "Respuesta Render (HTTP ${HTTP_STATUS}): $(printf '%s' "${RESP}" | head -c 600)"
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::error::Render aceptó la solicitud pero no aparece un deploy para el commit ${COMMIT}."
            exit 1
          fi
          echo "✅ Deploy de Render disparado o en cola: ${DEPLOY_ID}"

          # Sondeo del estado del deploy (hasta ~10 min)
          for i in $(seq 1 60); do
            sleep 10
            ST=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${ID}/deploys/${DEPLOY_ID}" \
              | jq -r '.status // .deploy.status // empty')
            echo "  estado: ${ST}"
            case "${ST}" in
              live) echo "✅ Render desplegado y live."; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::El deploy de Render terminó en '${ST}'. Revisa el dashboard de Render (Eventos/Logs)."
                exit 1 ;;
            esac
          done
          echo "::warning::Render sigue desplegando tras ~10 min; se deja el deploy en curso."

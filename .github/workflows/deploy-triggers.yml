name: Deploy triggers

# Fuerza el deploy de producción de Vercel por API en cada push a main.
# La integración Git de Vercel dejó de auto-desplegar (producción congelada
# desde el 30-sep), así que lo disparamos con el token ya existente
# (VERCEL_TOKEN) y esperamos a que el build quede READY.
#
# Render NO se dispara aquí en cada push: usa su
# "Auto-Deploy: After CI Checks Pass" nativo. El job de Render queda solo
# como RESPALDO MANUAL (se ejecuta con workflow_dispatch) por si algún día
# vuelve a fallar; para usarlo hay que tener el secreto RENDER_API_KEY y,
# opcionalmente, RENDER_SERVICE_ID (srv-xxxx).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel:
    name: Vercel (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar deploy de producción en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::warning::VERCEL_TOKEN no configurado — se omite el deploy de Vercel."
            exit 0
          fi

          RESP=$(curl -sS -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"code-hub\",\"project\":\"code-hub\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":856671518,\"ref\":\"main\",\"sha\":\"${COMMIT}\"}}")

          echo "Respuesta Vercel: $(printf '%s' "${RESP}" | head -c 600)"
          DEPLOY_ID=$(printf '%s' "${RESP}" | jq -r '.id // empty')
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::error::Vercel no devolvió un id de deployment."
            exit 1
          fi
          echo "✅ Deploy de Vercel disparado: ${DEPLOY_ID}"

          # Esperar a que Vercel termine el build (hasta ~4 min)
          for i in $(seq 1 48); do
            sleep 5
            STATE=$(curl -s "https://api.vercel.com/v13/deployments/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.readyState // empty')
            echo "  estado: ${STATE}"
            if [ "${STATE}" = "READY" ]; then
              echo "✅ Vercel listo."
              exit 0
            fi
            if [ "${STATE}" = "ERROR" ] || [ "${STATE}" = "CANCELED" ]; then
              echo "::error::El deployment de Vercel terminó en ${STATE}."
              exit 1
            fi
          done
          echo "::warning::Vercel sigue construyendo tras ~4 min; se deja el deployment en curso."

  render-manual:
    name: Render (respaldo manual)
    # Solo se ejecuta al lanzarlo a mano (workflow_dispatch), no en cada push:
    # en push normal el deploy de Render lo hace su auto-deploy nativo.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disparar deploy en Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ]; then
            echo "::warning::RENDER_API_KEY no configurado — respaldo manual de Render omitido."
            exit 0
          fi

          if [ -n "${RENDER_SERVICE_ID}" ]; then
            ID="${RENDER_SERVICE_ID}"
          else
            ID=$(curl -sf -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services?name=codehub&limit=1" | jq -r '.[0].id')
          fi
          if [ -z "${ID}" ] || [ "${ID}" = "null" ]; then
            echo "::error::No se encontró el servicio 'codehub' en Render (revisa RENDER_API_KEY / RENDER_SERVICE_ID)."
            exit 1
          fi
          echo "Servicio Render: ${ID}"

          RESP=$(curl -sS -X POST "https://api.render.com/v1/services/${ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"commitId\":\"${COMMIT}\",\"clearCache\":\"do_not_clear\"}")
          DEPLOY_ID=$(printf '%s' "${RESP}" | jq -r '.id // empty')
          if [ -z "${DEPLOY_ID}" ]; then
            echo "Reintentando deploy simple de Render tras: $(printf '%s' "${RESP}" | head -c 300)"
            RESP=$(curl -sS -X POST "https://api.render.com/v1/services/${ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache":"do_not_clear"}')
            DEPLOY_ID=$(printf '%s' "${RESP}" | jq -r '.id // empty')
          fi

          echo "Respuesta Render: $(printf '%s' "${RESP}" | head -c 600)"
          if [ -z "${DEPLOY_ID}" ]; then
            echo "::error::Render no devolvió un id de deploy."
            exit 1
          fi
          echo "✅ Deploy de Render disparado: ${DEPLOY_ID}"

          # Sondeo del estado del deploy (hasta ~10 min)
          for i in $(seq 1 60); do
            sleep 10
            ST=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${ID}/deploys/${DEPLOY_ID}" \
              | jq -r '.status // .deploy.status // empty')
            echo "  estado: ${ST}"
            case "${ST}" in
              live) echo "✅ Render desplegado y live."; exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::El deploy de Render terminó en '${ST}'. Revisa el dashboard de Render (Eventos/Logs)."
                exit 1 ;;
            esac
          done
          echo "::warning::Render sigue desplegando tras ~10 min; se deja el deploy en curso."

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Verificación segura · CodeHub</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#090d16;color:#eef2ff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,420px);padding:28px;border:1px solid #303a50;border-radius:24px;background:#141b29;text-align:center;box-shadow:0 24px 70px #0007}
    .mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 16px;border-radius:18px;background:#252448;color:#a5adff;font-size:28px;font-weight:800}
    h1{margin:0;font-size:22px}p{margin:10px 0 22px;color:#aab3c6;line-height:1.5}#challenge{display:flex;justify-content:center;min-height:66px}.error{color:#ff9b9b}
    button{border:1px solid #505c79;border-radius:12px;background:#202b40;color:#eef2ff;padding:10px 16px;font:600 14px system-ui;cursor:pointer}
  </style>
  <script id="turnstile-api" src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body><main>
  <div class="mark">C</div>
  <h1>Verificación segura</h1>
  <p>Completa esta comprobación para continuar en CodeHub. Al terminar volverás a la app.</p>
  <div id="challenge"></div>
  <p id="message" role="status">Cargando verificación…</p>
  <button id="retry" type="button" hidden>Reintentar verificación</button>
</main>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search),state=params.get('state')||'';
  var message=document.getElementById('message'),retry=document.getElementById('retry'),widgetId=null,timer=null;
  function showError(text){
    if(timer){clearInterval(timer);timer=null;}
    message.className='error';message.textContent=text;retry.hidden=false;
  }
  retry.addEventListener('click',function(){
    if(window.turnstile&&widgetId!==null){
      retry.hidden=true;message.className='';message.textContent='Completa el reto para continuar.';
      window.turnstile.reset(widgetId);
    }else location.reload();
  });
  function returnToApp(token,error){
    var url=new URL('codehub://auth/turnstile');
    url.searchParams.set('state',state);
    if(token)url.searchParams.set('code',token);
    if(error)url.searchParams.set('error',error);
    location.href=url.toString();
  }
  if(!state){message.className='error';message.textContent='La solicitud llegó incompleta. Vuelve a CodeHub y comienza otra vez.';return;}
  document.getElementById('turnstile-api').addEventListener('error',function(){
    showError('No se pudo descargar el verificador de Cloudflare. Revisa tu conexión y reintenta.');
  });
  var tries=0;
  timer=setInterval(function(){
    if(window.turnstile){
      clearInterval(timer);timer=null;
      try{
        widgetId=window.turnstile.render('#challenge',{
          sitekey:'0x4AAAAAAClKd5T1R81GltW_',
          callback:function(token){
            message.textContent='Validando y preparando regreso seguro…';
            fetch('https://codehub-98s6.onrender.com/api/auth/mobile-challenge/complete',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({state:state,turnstileToken:token})
            }).then(function(r){return r.json().then(function(data){if(!r.ok)throw new Error(data.error||'Error al validar');return data;});})
              .then(function(data){retry.hidden=true;returnToApp(data.code,'');})
              .catch(function(e){showError(e.message||'No se pudo confirmar la verificación.');});
          },
          'error-callback':function(code){showError('Cloudflare no pudo completar la comprobación'+(code?' ('+code+')':'')+'. Reintenta.');},
          'expired-callback':function(){message.textContent='La verificación expiró. Completa el reto otra vez.';retry.hidden=false;},
          'unsupported-callback':function(){showError('Este navegador no es compatible. Abre la verificación en Chrome o Firefox.');}
        });
        message.textContent='Completa el reto para continuar.';
      }catch(e){showError('No se pudo iniciar la verificación de Cloudflare. Reintenta.');}
    }else if(++tries>120){
      showError('Turnstile tardó demasiado en cargar. Revisa la conexión o el bloqueador de contenido y reintenta.');
    }
  },100);
})();
</script>
</body></html>

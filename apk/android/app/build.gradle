plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.codehub.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.codehub.app"
        minSdk 24
        targetSdk 36
        // La serie debe coincidir con sw.js VERSION (site/PWA = 7.x), porque
        // build-apk.yml publica el APK como apk-<VERSION> y AppUpdateChecker.java
        // compara ese tag contra este versionName. En CI, el workflow
        // "Sincronizar versión" sobreescribe ambos valores desde sw.js para que
        // la versión instalada siempre coincida con el tag del release.
        versionCode 9
        versionName "7.17"
    }

    lint {
        // lintVital* (release) moría por OutOfMemoryError en el runner al
        // analizar :echo (build #423). No aporta a un APK auto-publicado:
        // la calidad la cubre assembleDebug (paso CI) sin gastar ~3GB extra
        // de heap durante el firmado.
        checkReleaseBuilds false
    }

    signingConfigs {
        release {
            def ksPath = project.hasProperty('KEYSTORE_PATH') ? project.property('KEYSTORE_PATH') : 'release.jks'
            def ksPass = project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ''
            def keyPass = project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ''
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias "codehub"
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // minSdk 24 < 26 → necesario para las APIs `java.time` que usan
        // (en runtime) las librerías del stack de anuncios/analytics sin subir
        // el minSdk (ver AlexParser/AutoLauncher y el fork de Echo).
        coreLibraryDesugaringEnabled true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    // Reproductor completo de Echo Nightly (see apk/android/echo). Se lanza
    // desde el panel Música de CodeHub (CodeHubBridge.openMusic).
    implementation project(':echo')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
    // Requerido en runtime por FirebaseInstallations (JavaDataStorage) desde
    // versiones recientes del BOM — sin esto, NoClassDefFoundError al
    // registrar el token FCM (registerFCMToken -> FirebaseInstallations).
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    // UMP — Consentimiento GDPR/CCPA (User Messaging Platform). Artefacto del
    // SDK de Google (com.google.android.ump), distinto de play-services-ads.
    // Debe consultarse antes de pedir anuncios en regiones exigidas (EEE/UK/Canadá).
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    // Unity Ads (SDK directo, sin mediación). Game ID y placements se declaran
    // en UnityAdsManager.java; el banner vive en la franja reservada del layout.
    implementation 'com.unity3d.ads:unity-ads:4.20.0'
    // Desugaring de librerías java.time (ver compileOptions arriba).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // WorkManager — sync periódico (FCM + ubicación) sin Foreground Service.
    // Reemplaza a CodeHubSyncService (tipo dataSync), que en Android 15/16
    // lanzaba ForegroundServiceDidNotStopInTimeException. Misma versión que la
    // que ya arrastra :echo (koin-androidx-workmanager:4.1.0 → 2.10.1); el
    // inicializador por defecto lo desactiva :echo y lo enciende EchoBoot.
    implementation 'androidx.work:work-runtime:2.10.1'
    // Shizuku — detección de servicio/permiso + instalación silenciosa de
    // APKs (apps Open Source) sin el diálogo nativo, cuando el usuario
    // tiene Shizuku activo (ADB inalámbrico o root). Ver ShizukuInstaller.java.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // Kotlin + Coroutines — núcleo de mantenimiento con Shizuku
    // (borrarCacheTurbo / killAppsPro) en hilos secundarios sin congelar
    // el UI del WebView.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Music player "slide" - jugador nativo compacto para extensiones del
    // ecosistema Echo (echo-nightly). Contrato de extensiones reciclado
    // byte-a-byte desde Maven Central (dev.brahmkshatriya.echo:common:1.0.0,
    // common-android, publicada 2025-10-14). Sin Room/Koin/KSP: la app solo
    // consume la API; el parser de extensiones es un port de ExtensionParser.
    // Licencia de las extensiones: UPL-1.0 / GPLv3 - ver nota en apk/README.md.
    // Se excluye protobuf-java: echo common lo declara en su POM pero el AAR
    // common-android (282 clases, verificado) NO referencia com.google.protobuf
    // en su bytecode. El exclude es defensivo para no arrastrar una copia
    // duplicada de com.google.protobuf.* junto a otras dependencias.
    implementation('dev.brahmkshatriya.echo:common:1.0.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
    // Media3 (ExoPlayer 1.8.0, misma version que el fork) - HLS/DASH del
    // reproductor + progresivo. El cache de SimpleCache no se usa en v1.
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    // media3-session - MediaSessionService en segundo plano (notificación de
    // medios, botones/headset, bloqueo y salidas de sistema). Port del
    // PlayerService de echo-nightly.
    implementation 'androidx.media3:media3-session:1.8.0'
    // Listas de shelves/colas del player (stable, agnostico de tema).
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // okhttp del ecosistema Echo - llega transitivamente con common:1.0.0
    // como `okhttp-android` (variante Android). Se declara explicitamente con
    // LA MISMA variante android para fijar version sin provocar clases
    // duplicadas: declarar `okhttp` (JVM) junto a `okhttp-android` hace que
    // AGP falle en checkDebugDuplicateClasses (mismas okhttp3/* en ambos GAV).
    implementation 'com.squareup.okhttp3:okhttp-android:5.1.0'
}

// La librería androidx.datastore migró a Kotlin Multiplatform en versiones
// recientes (variantes -core/-android por separado); en ese esquema Gradle
// a veces resuelve una variante que NO trae PreferenceDataStoreDelegateKt,
// causando NoClassDefFoundError aunque la dependencia esté declarada arriba
// (bug conocido y aún abierto en varios issues de firebase-android-sdk).
// Forzamos la versión 1.0.0 (clásica, un solo .aar de Android, sin
// ambigüedad de variantes KMP) en TODO el árbol de dependencias, incluida
// cualquier versión distinta que firebase-installations pida por su cuenta.
configurations.all {
    resolutionStrategy {
        force 'androidx.datastore:datastore-preferences:1.0.0'
        force 'androidx.datastore:datastore-core:1.0.0'
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codehub.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.codehub.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            def ksPath = project.hasProperty('KEYSTORE_PATH') ? project.property('KEYSTORE_PATH') : 'release.jks'
            def ksPass = project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ''
            def keyPass = project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ''
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias "codehub"
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.0'
}
